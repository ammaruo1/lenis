<!doctype html>
<html lang="ar" dir="rtl" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preload" href="/LinaRound-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/LinaRound-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>الجيل العربي الرقمي — أجهزة وتجهيزات وحلول تقنية</title>
    <meta name="description" content="الجيل العربي الرقمي - نوفر أحدث الأجهزة والتجهيزات والحلول التقنية للشركات والمؤسسات بمعايير جودة عالية." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="الجيل العربي الرقمي — أجهزة وتجهيزات وحلول تقنية" />
    <meta property="og:description" content="الجيل العربي الرقمي - نوفر أحدث الأجهزة والتجهيزات والحلول التقنية للشركات والمؤسسات بمعايير جودة عالية." />
    
    <!-- Initial Setup Script -->
    <script>
      // Apply correct language, direction and theme on load to prevent flash
      try {
        const savedLang = localStorage.getItem('alarbi_lang') || 'ar';
        const dir = savedLang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = savedLang;
        document.documentElement.dir = dir;

        const savedTheme = localStorage.getItem('alarbi_theme') || 'light';
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; background: #0B0B0F; color: white; direction: rtl;">
        يتطلب هذا الموقع تفعيل JavaScript
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
