<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>الجيل العربي الرقمي — أجهزة وتجهيزات وحلول تقنية</title>
    <meta name="description" content="الجيل العربي الرقمي - نوفر أحدث الأجهزة والتجهيزات والحلول التقنية للشركات والمؤسسات بمعايير جودة عالية." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="الجيل العربي الرقمي — أجهزة وتجهيزات وحلول تقنية" />
    <meta property="og:description" content="الجيل العربي الرقمي - نوفر أحدث الأجهزة والتجهيزات والحلول التقنية للشركات والمؤسسات بمعايير جودة عالية." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Initial Setup Script -->
    <script>
      // Apply correct language and direction on load to prevent flash
      try {
        const savedLang = localStorage.getItem('alarbi_lang') || 'ar';
        const dir = savedLang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = savedLang;
        document.documentElement.dir = dir;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; background: #0B0B0F; color: white; direction: rtl;">
        يتطلب هذا الموقع تفعيل JavaScript
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
